<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <g transform="translate(4, 8)">
    <!-- German Federal eagle stylized representation + flag lines -->
    <rect x="0" y="2" width="2.5" height="12" fill="#000000" />
    <rect x="0" y="14" width="2.5" height="12" fill="#DD0000" />
    <rect x="0" y="26" width="2.5" height="12" fill="#FFCC00" />
    
    <g transform="translate(14, 0)">
      <text x="0" y="11" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#E2E8F0" letter-spacing="0.02em">Gefördert durch:</text>
      <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="-0.01em">Bundesministerium</text>
      <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="-0.01em">für Wirtschaft</text>
      <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="-0.01em">und Klimaschutz</text>
    </g>
  </g>
</svg>
