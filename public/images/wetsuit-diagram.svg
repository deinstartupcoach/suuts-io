<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="50%" stop-color="#14233C" />
      <stop offset="100%" stop-color="#0B1320" />
    </linearGradient>
    <linearGradient id="panelChest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2E4B" />
      <stop offset="100%" stop-color="#16253D" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <filter id="meshGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid Subtle -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.04)" stroke-width="0.8" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Wetsuit Outline Silhouette & Panels -->
  <g transform="translate(50, 30)">
    <!-- Wetsuit Torso & Limbs Base -->
    <!-- Shoulders & Arms -->
    <path d="M120 70 L60 170 L80 185 L125 110 L135 220 L115 360 L130 540 L160 540 L180 340 L200 340 L220 540 L250 540 L265 360 L245 220 L255 110 L300 185 L320 170 L260 70 L225 55 L155 55 Z" 
          fill="url(#suitGrad)" stroke="#223656" stroke-width="2" />
    
    <!-- Chest / Smoothskin Core Panel (Thermal Core 4mm / 3mm) -->
    <path d="M150 75 Q190 70 230 75 L225 180 Q190 195 155 180 Z" 
          fill="url(#panelChest)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
    <text x="190" y="130" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#00F2FE" text-anchor="middle" letter-spacing="0.05em">THERMAL CORE 4.0mm</text>
    <text x="190" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#94A3B8" text-anchor="middle">Zero-Gap Anatomical Chest</text>

    <!-- Collar Hydro-Lock Seal -->
    <ellipse cx="190" cy="55" rx="35" ry="14" fill="none" stroke="#00FFA3" stroke-width="2.5" filter="url(#meshGlow)" />
    <text x="190" y="40" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#00FFA3" text-anchor="middle">GLIDESKIN HYDRO-LOCK NECK</text>

    <!-- Ergonomic Shoulder Paddle Zones (Flexible 2.5mm Neoprene) -->
    <path d="M130 85 L95 145 L115 155 L140 105 Z" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.5)" stroke-dasharray="3,3" />
    <path d="M250 85 L285 145 L265 155 L240 105 Z" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.5)" stroke-dasharray="3,3" />
    
    <!-- Lumbar & Spine Compression Zone -->
    <path d="M170 195 Q190 200 210 195 L205 310 Q190 320 175 310 Z" fill="rgba(79, 172, 254, 0.08)" stroke="#4FACFE" stroke-width="1" />
    <text x="190" y="255" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="600" fill="#4FACFE" text-anchor="middle">BIOMETRIC WAIST TENSION</text>

    <!-- Knee Articulation Flex Pads -->
    <rect x="127" y="390" width="30" height="40" rx="6" fill="rgba(0, 255, 163, 0.1)" stroke="#00FFA3" stroke-width="1.2" />
    <rect x="223" y="390" width="30" height="40" rx="6" fill="rgba(0, 255, 163, 0.1)" stroke="#00FFA3" stroke-width="1.2" />
    <text x="190" y="415" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="700" fill="#00FFA3" text-anchor="middle">3D ERGO-KNEE PADS</text>

    <!-- Biometric Measurement Callout Lines & Points -->
    <!-- Chest Width -->
    <line x1="120" y1="120" x2="260" y2="120" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="120" cy="120" r="3" fill="#00F2FE" />
    <circle cx="260" cy="120" r="3" fill="#00F2FE" />
    <rect x="290" y="110" width="95" height="22" rx="4" fill="#070B14" stroke="#00F2FE" stroke-width="1" />
    <text x="337" y="125" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#00F2FE" text-anchor="middle">CHEST: 104.2 cm</text>
    <line x1="260" y1="120" x2="290" y2="120" stroke="#00F2FE" stroke-width="1" />

    <!-- Torso Length -->
    <line x1="190" y1="65" x2="190" y2="330" stroke="#00FFA3" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="20" y="200" width="105" height="22" rx="4" fill="#070B14" stroke="#00FFA3" stroke-width="1" />
    <text x="72" y="215" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#00FFA3" text-anchor="middle">TORSO ARC: 76.8 cm</text>
    <line x1="125" y1="211" x2="190" y2="211" stroke="#00FFA3" stroke-width="1" />

    <!-- Inseam / Leg Length -->
    <line x1="190" y1="330" x2="145" y2="535" stroke="#4FACFE" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="280" y="470" width="100" height="22" rx="4" fill="#070B14" stroke="#4FACFE" stroke-width="1" />
    <text x="330" y="485" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#4FACFE" text-anchor="middle">INSEAM: 82.4 cm</text>
    <line x1="235" y1="481" x2="280" y2="481" stroke="#4FACFE" stroke-width="1" />

    <!-- Ankle Cuff Seal -->
    <ellipse cx="145" cy="540" rx="15" ry="5" fill="none" stroke="#00F2FE" stroke-width="1.5" />
    <ellipse cx="235" cy="540" rx="15" ry="5" fill="none" stroke="#00F2FE" stroke-width="1.5" />
  </g>
</svg>
