<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#070B14" />
  <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5" />
  
  <!-- S shape constructed from 3D biometric measurement vertices -->
  <path d="M33 15C31 12 26 11 22 12C16 13.5 14 18 16 22C18 26 30 25 32 29C34 33 30 37 24 37C18 37 14 34 13 31" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Biometric vertex points -->
  <circle cx="33" cy="15" r="2.5" fill="#00FFA3" />
  <circle cx="22" cy="12" r="2" fill="#00F2FE" />
  <circle cx="16" cy="22" r="2" fill="#00FFA3" />
  <circle cx="32" cy="29" r="2" fill="#00F2FE" />
  <circle cx="13" cy="31" r="2.5" fill="#00FFA3" />
</svg>
